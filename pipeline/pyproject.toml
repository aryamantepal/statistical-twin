[project]
name = "statistical-twin"
version = "0.1.0"
description = "Nearest-neighbour 'statistical twins' for big-five-league player-seasons"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyreadr>=0.5",
    "rapidfuzz>=3.9",
    "scipy>=1.13",
    "httpx>=0.27",
]

[project.scripts]
twin = "twin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
